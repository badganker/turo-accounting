# Fly.io app config. `app` must be globally unique — `fly launch` will
# prompt to change it if "turo-accounting" is taken.
app = "turo-accounting"
primary_region = "sjc"

[build]

[env]
  PORT = "4100"
  DATA_DIR = "/data"
  NODE_ENV = "production"

[[mounts]]
  source = "turo_data"
  destination = "/data"

[http_service]
  internal_port = 4100
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
